objects:
  - apiName: LinkedIn_Outreach
    label: LinkedIn Outreach
    pluralLabel: LinkedIn Outreach
    description: Tracks LinkedIn Sales Navigator connection requests, messages, InMails, replies, and meeting outcomes.
    deploymentStatus: Deployed
    sharingModel: ReadWrite
    enableActivities: true
    enableReports: true
    enableSearch: true
    nameField:
      label: Outreach Number
      type: AutoNumber
      displayFormat: LIO-{00000}
    fields:
      - apiName: Lead
        label: Lead
        type: Lookup
        referenceTo: Lead
        relationshipLabel: LinkedIn Outreach
        relationshipName: LinkedIn_Outreach_Lead
        deleteConstraint: SetNull
      - apiName: Contact
        label: Contact
        type: Lookup
        referenceTo: Contact
        relationshipLabel: LinkedIn Outreach
        relationshipName: LinkedIn_Outreach_Contact
        deleteConstraint: SetNull
      - apiName: Account
        label: Account
        type: Lookup
        referenceTo: Account
        relationshipLabel: LinkedIn Outreach
        relationshipName: LinkedIn_Outreach_Account
        deleteConstraint: SetNull
      - apiName: Outreach_Date
        label: Outreach Date
        type: Date
        required: true
      - apiName: Activity_Type
        label: Activity Type
        type: Picklist
        required: true
        valueSet:
          restricted: true
          sorted: false
          values:
            - fullName: Connection Request
            - fullName: Message
            - fullName: InMail
            - fullName: Reply
            - fullName: Comment
            - fullName: Profile View
            - fullName: Meeting Requested
            - fullName: Meeting Booked
            - fullName: Email Attempt
            - fullName: Phone Call
            - fullName: Voicemail
            - fullName: Call Connected
            - fullName: Other
      - apiName: Channel
        label: Channel
        type: Picklist
        required: true
        valueSet:
          restricted: true
          sorted: false
          values:
            - fullName: Sales Navigator
            - fullName: LinkedIn
            - fullName: Email
            - fullName: Phone
            - fullName: Other
      - apiName: Direction
        label: Direction
        type: Picklist
        valueSet:
          restricted: true
          sorted: false
          values:
            - fullName: Outbound
            - fullName: Inbound
      - apiName: Outcome
        label: Outcome
        type: Picklist
        valueSet:
          restricted: true
          sorted: false
          values:
            - fullName: Sent
            - fullName: Accepted
            - fullName: Replied
            - fullName: Meeting Requested
            - fullName: Meeting Booked
            - fullName: No Response
            - fullName: Left Voicemail
            - fullName: Connected Live
            - fullName: Email Bounced
            - fullName: Not a Fit
            - fullName: Nurture
      - apiName: Message_Summary
        label: Message Summary
        type: LongTextArea
        length: 32768
        visibleLines: 5
      - apiName: LinkedIn_Profile_URL
        label: LinkedIn Profile URL
        type: Url
      - apiName: Sales_Navigator_URL
        label: Sales Navigator URL
        type: Url
      - apiName: Source_List
        label: Source List
        type: Text
        length: 255
      - apiName: Campaign_Name
        label: Campaign Name
        type: Text
        length: 255
      - apiName: Meeting_Requested
        label: Meeting Requested
        type: Checkbox
        defaultValue: "false"
      - apiName: Follow_Up_Date
        label: Follow-Up Date
        type: Date

